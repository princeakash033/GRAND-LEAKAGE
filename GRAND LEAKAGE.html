<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAND LEAKAGE // Threat & Entity Archive</title>
  <style>
    :root {
      --bg-dark: #050807;
      --bg-panel: rgba(10, 18, 14, 0.9);
      --bg-input: #070d0a;
      --neon: #00ff66;
      --neon-dim: rgba(0, 255, 102, 0.22);
      --neon-glow: 0 0 12px rgba(0, 255, 102, 0.35);
      --danger: #ff3b5c;
      --warn: #ffb020;
      --info: #38bdf8;
      --text: #d8ffe7;
      --muted: #7aa38a;
      --border: #173624;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Hacking grid + scanline background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0, 255, 102, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 102, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 255, 102, 0.03) 3px,
        rgba(0, 0, 0, 0.25) 4px
      );
      z-index: -1;
      pointer-events: none;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(5, 10, 8, 0.92);
      backdrop-filter: blur(6px);
      padding: 1.25rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand h1 {
      color: var(--neon);
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      letter-spacing: 3px;
      text-shadow: var(--neon-glow);
    }

    .brand p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 0.25rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
      color: var(--neon);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    main {
      max-width: 1200px;
      margin: 1.75rem auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    @media (max-width: 920px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .panel-title {
      color: var(--neon);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 0.95rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 0.7rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 2px var(--neon-dim);
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    input[type="file"] {
      width: 100%;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .btn {
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
      padding: 0.65rem 1rem;
      border: 1px solid var(--neon);
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-primary {
      width: 100%;
      background: var(--neon-dim);
      color: var(--neon);
    }

    .btn-primary:hover {
      background: var(--neon);
      color: #041008;
      box-shadow: var(--neon-glow);
    }

    .btn-sm {
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-sm:hover {
      border-color: var(--neon);
      color: var(--neon);
    }

    .btn-danger {
      border-color: rgba(255, 59, 92, 0.5);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      flex: 1;
    }

    .search-filter input,
    .search-filter select {
      min-width: 170px;
      flex: 1;
    }

    .backup-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: rgba(7, 13, 10, 0.92);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--neon);
    }

    .card-photo {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #030604;
      border-bottom: 1px solid var(--border);
    }

    .no-photo {
      width: 100%;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030604;
      color: var(--muted);
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .record-id {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.18rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
      font-weight: bold;
      border: 1px solid currentColor;
    }

    .badge-fake { color: var(--warn); background: rgba(255, 176, 32, 0.12); }
    .badge-scam { color: var(--danger); background: rgba(255, 59, 92, 0.12); }
    .badge-crime { color: #ff6b8b; background: rgba(255, 107, 139, 0.15); }
    .badge-other { color: var(--info); background: rgba(56, 189, 248, 0.12); }

    .card-name {
      font-size: 1.05rem;
      color: var(--neon);
      word-break: break-word;
    }

    .card-notes {
      font-size: 0.82rem;
      color: var(--text);
      opacity: 0.88;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .card-footer {
      margin-top: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(23, 54, 36, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>GRAND LEAKAGE</h1>
        <p>PERSISTENT ENTITY &amp; INCIDENT ARCHIVE // LOCAL STORAGE ENGINE</p>
      </div>
      <div class="status-bar">
        <span class="dot"></span>
        <span id="recordCount">0 RECORDS STORED</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Add Entry Form -->
    <section class="panel">
      <h2 class="panel-title">[+] Add Record</h2>
      <form id="leakForm">
        <div class="form-group">
          <label for="entryId">ID *</label>
          <input type="text" id="entryId" placeholder="e.g. GL-1042" required />
        </div>

        <div class="form-group">
          <label for="entryName">Name / Alias *</label>
          <input type="text" id="entryName" placeholder="e.g. Target or Handle" required />
        </div>

        <div class="form-group">
          <label for="entryType">Person / Threat Type *</label>
          <select id="entryType" required>
            <option value="Fake">Fake</option>
            <option value="Scam">Scam</option>
            <option value="Crime">Crime</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="entryPhotoFile">Upload Photo (Saved Permanently)</label>
          <input type="file" id="entryPhotoFile" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="entryPhotoUrl">Or Photo URL (Optional)</label>
          <input type="text" id="entryPhotoUrl" placeholder="https://example.com/photo.jpg" />
        </div>

        <div class="form-group">
          <label for="entryNotes">Additional Details / Notes</label>
          <textarea id="entryNotes" placeholder="Enter evidence, links, or incident notes..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">COMMIT TO GRAND LEAKAGE</button>
      </form>
    </section>

    <!-- Stored Records Viewer -->
    <section class="panel">
      <h2 class="panel-title">[#] Stored Database</h2>

      <div class="controls-bar">
        <div class="search-filter">
          <input type="text" id="searchInput" placeholder="Search by ID, name, or notes..." />
          <select id="filterType">
            <option value="ALL">All Types</option>
            <option value="Fake">Fake</option>
            <option value="Scam">Scam</option>
            <option value="Crime">Crime</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="backup-actions">
          <button type="button" class="btn btn-sm" id="exportBtn">Export JSON</button>
          <button type="button" class="btn btn-sm" id="importTriggerBtn">Import JSON</button>
          <input type="file" id="importFileInput" accept="application/json" style="display:none;" />
        </div>
      </div>

      <div id="recordsContainer" class="records-grid"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "GRAND_LEAKAGE_RECORDS_V1";

    const leakForm = document.getElementById("leakForm");
    const entryIdInput = document.getElementById("entryId");
    const entryNameInput = document.getElementById("entryName");
    const entryTypeInput = document.getElementById("entryType");
    const entryPhotoFileInput = document.getElementById("entryPhotoFile");
    const entryPhotoUrlInput = document.getElementById("entryPhotoUrl");
    const entryNotesInput = document.getElementById("entryNotes");

    const searchInput = document.getElementById("searchInput");
    const filterTypeSelect = document.getElementById("filterType");
    const recordsContainer = document.getElementById("recordsContainer");
    const recordCountEl = document.getElementById("recordCount");

    const exportBtn = document.getElementById("exportBtn");
    const importTriggerBtn = document.getElementById("importTriggerBtn");
    const importFileInput = document.getElementById("importFileInput");

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        console.error("Failed to load records:", err);
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function getBadgeClass(type) {
      switch (type) {
        case "Fake": return "badge-fake";
        case "Scam": return "badge-scam";
        case "Crime": return "badge-crime";
        default: return "badge-other";
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderRecords() {
      const records = loadRecords();
      const query = searchInput.value.trim().toLowerCase();
      const selectedType = filterTypeSelect.value;

      recordCountEl.textContent = `${records.length} RECORD${records.length === 1 ? "" : "S"} STORED`;

      const filtered = records.filter((item) => {
        const matchesType = selectedType === "ALL" || item.type === selectedType;
        const matchesQuery =
          !query ||
          item.id.toLowerCase().includes(query) ||
          item.name.toLowerCase().includes(query) ||
          (item.notes && item.notes.toLowerCase().includes(query));
        return matchesType && matchesQuery;
      });

      if (filtered.length === 0) {
        recordsContainer.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            No matching records found in GRAND LEAKAGE.
          </div>
        `;
        return;
      }

      recordsContainer.innerHTML = filtered
        .map(
          (item) => `
          <article class="card">
            ${
              item.photo
                ? `<img class="card-photo" src="${escapeHtml(item.photo)}" alt="${escapeHtml(item.name)}" />`
                : `<div class="no-photo">[ NO PHOTO ATTACHED ]</div>`
            }
            <div class="card-body">
              <div class="card-top">
                <span class="record-id">ID: ${escapeHtml(item.id)}</span>
                <span class="badge ${getBadgeClass(item.type)}">${escapeHtml(item.type)}</span>
              </div>
              <h3 class="card-name">${escapeHtml(item.name)}</h3>
              <p class="card-notes">${escapeHtml(item.notes || "No additional details recorded.")}</p>
              <div class="card-footer">
                <span>${escapeHtml(item.createdAt || "")}</span>
                <button type="button" class="btn btn-sm btn-danger" onclick="deleteRecord('${escapeHtml(item.uid)}')">Delete</button>
              </div>
            </div>
          </article>
        `
        )
        .join("");
    }

    window.deleteRecord = function (uid) {
      const records = loadRecords().filter((r) => r.uid !== uid);
      saveRecords(records);
      renderRecords();
    };

    leakForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = entryIdInput.value.trim();
      const name = entryNameInput.value.trim();
      const type = entryTypeInput.value;
      const notes = entryNotesInput.value.trim();
      const urlVal = entryPhotoUrlInput.value.trim();
      const file = entryPhotoFileInput.files[0];

      let photo = "";
      if (file) {
        try {
          photo = await readFileAsDataUrl(file);
        } catch {
          alert("Could not read uploaded image file.");
          return;
        }
      } else if (urlVal) {
        photo = urlVal;
      }

      const newRecord = {
        uid: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        id,
        name,
        type,
        photo,
        notes,
        createdAt: new Date().toLocaleString()
      };

      const records = loadRecords();
      records.unshift(newRecord);
      saveRecords(records);
      renderRecords();
      leakForm.reset();
    });

    searchInput.addEventListener("input", renderRecords);
    filterTypeSelect.addEventListener("change", renderRecords);

    exportBtn.addEventListener("click", () => {
      const data = localStorage.getItem(STORAGE_KEY) || "[]";
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "grand-leakage-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    importTriggerBtn.addEventListener("click", () => importFileInput.click());

    importFileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const imported = JSON.parse(text);
        if (!Array.isArray(imported)) {
          alert("Invalid backup JSON format.");
          return;
        }
        const existing = loadRecords();
        const existingUids = new Set(existing.map((r) => r.uid));
        const merged = [
          ...imported.filter((r) => r && r.id && r.name && !existingUids.has(r.uid)),
          ...existing
        ];
        saveRecords(merged);
        renderRecords();
      } catch {
        alert("Failed to import JSON file.");
      } finally {
        importFileInput.value = "";
      }
    });

    // Initial render
    renderRecords();
  </script>
</body>
</html>
