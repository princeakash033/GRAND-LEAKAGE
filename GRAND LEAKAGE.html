<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAND LEAKAGE // ARCHIVE DATABASE</title>
  <style>
    :root {
      --bg-dark: #050805;
      --panel-bg: rgba(8, 16, 10, 0.9);
      --border-glow: #00ff41;
      --text-main: #00ff41;
      --text-dim: #008f11;
      --danger: #ff2a2a;
      --warning: #ffae00;
      --info: #00e5ff;
      --other: #b388ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Matrix Rain Canvas Background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.25;
    }

    /* Scanline Overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18),
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      border-bottom: 2px solid var(--border-glow);
      background: rgba(0, 12, 2, 0.92);
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 18px rgba(0, 255, 65, 0.3);
    }

    .brand h1 {
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--border-glow);
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    button {
      background: #001a05;
      color: var(--text-main);
      border: 1px solid var(--border-glow);
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--border-glow);
      color: #000;
      box-shadow: 0 0 12px var(--border-glow);
    }

    button.btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    button.btn-danger:hover {
      background: var(--danger);
      color: #000;
      box-shadow: 0 0 12px var(--danger);
    }

    main {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1rem 3rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      padding: 1.25rem;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.15);
    }

    .panel h2 {
      font-size: 1.1rem;
      border-bottom: 1px dashed var(--text-dim);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 0.9rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
      color: #7dff9b;
    }

    input, select, textarea {
      width: 100%;
      background: #020a03;
      border: 1px solid var(--text-dim);
      color: var(--text-main);
      padding: 0.6rem;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.35);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    #photo-preview {
      margin-top: 0.5rem;
      max-width: 100%;
      max-height: 140px;
      display: none;
      border: 1px solid var(--border-glow);
      object-fit: cover;
    }

    /* Controls Bar */
    .controls-bar {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 550px) {
      .controls-bar {
        grid-template-columns: 1fr;
      }
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      padding: 0.6rem;
      background: rgba(0, 40, 10, 0.5);
      border: 1px solid var(--text-dim);
    }

    /* Records Grid */
    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .record-card {
      background: #030b04;
      border: 1px solid var(--text-dim);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .record-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.25);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
      gap: 0.5rem;
    }

    .record-id {
      font-size: 0.8rem;
      color: #88ff9e;
      font-weight: bold;
      word-break: break-all;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      font-weight: bold;
      text-transform: uppercase;
      border: 1px solid;
    }

    .badge-Fake { color: var(--warning); border-color: var(--warning); }
    .badge-Scams { color: #ff6d00; border-color: #ff6d00; }
    .badge-Crime { color: var(--danger); border-color: var(--danger); }
    .badge-Others { color: var(--other); border-color: var(--other); }

    .record-photo {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border: 1px solid var(--text-dim);
      margin-bottom: 0.7rem;
      background: #000;
    }

    .record-name {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .record-details {
      font-size: 0.84rem;
      color: #b4ffbe;
      line-height: 1.4;
      margin-bottom: 0.8rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .record-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      border-top: 1px dashed #0a3b12;
      padding-top: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
    }

    .card-actions button {
      padding: 0.3rem 0.55rem;
      font-size: 0.72rem;
    }

    /* Modal for Full View */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-box {
      background: #050e06;
      border: 2px solid var(--border-glow);
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: 0 0 25px rgba(0, 255, 65, 0.4);
    }

    .modal-box img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border: 1px solid var(--border-glow);
      margin: 0.8rem 0;
      background: #000;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      border: 1px dashed var(--text-dim);
    }
  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <header>
    <div class="brand">
      <h1>&gt;_ GRAND LEAKAGE</h1>
      <p>[ STATUS: ONLINE // PERSISTENT LOCAL NODE STORAGE ACTIVE ]</p>
    </div>
    <div class="header-actions">
      <button onclick="exportBackup()">Export Backup (.JSON)</button>
      <button onclick="document.getElementById('import-file').click()">Import Backup</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)" />
    </div>
  </header>

  <main>
    <!-- Left Panel: Add New Record -->
    <section class="panel">
      <h2>// INJECT NEW RECORD</h2>
      <form id="leak-form">
        <div class="form-group">
          <label for="person-id">TARGET ID *</label>
          <input type="text" id="person-id" placeholder="e.g., GL-2026-001" required />
        </div>

        <div class="form-group">
          <label for="person-name">TARGET NAME / ALIAS *</label>
          <input type="text" id="person-name" placeholder="Full Name or Handle" required />
        </div>

        <div class="form-group">
          <label for="person-type">CLASSIFICATION TYPE *</label>
          <select id="person-type" required>
            <option value="Fake">FAKE</option>
            <option value="Scams">SCAMS</option>
            <option value="Crime">CRIME</option>
            <option value="Others">OTHERS</option>
          </select>
        </div>

        <div class="form-group">
          <label for="person-photo">UPLOAD PHOTO (SAVED LOCALLY)</label>
          <input type="file" id="person-photo" accept="image/*" />
          <img id="photo-preview" alt="Preview" />
        </div>

        <div class="form-group">
          <label for="person-details">LEAKED DETAILS / INTEL *</label>
          <textarea id="person-details" placeholder="Enter phone numbers, addresses, IP logs, case notes, evidence..." required></textarea>
        </div>

        <button type="submit" style="width: 100%;">[ STORE PERMANENTLY ]</button>
      </form>
    </section>

    <!-- Right Panel: View Stored Database -->
    <section class="panel">
      <h2>// STORED ARCHIVE RECORDS</h2>

      <div class="controls-bar">
        <input type="text" id="search-input" placeholder="Search by ID, Name, or Details..." oninput="renderRecords()" />
        <select id="filter-type" onchange="renderRecords()">
          <option value="ALL">ALL TYPES</option>
          <option value="Fake">FAKE</option>
          <option value="Scams">SCAMS</option>
          <option value="Crime">CRIME</option>
          <option value="Others">OTHERS</option>
        </select>
      </div>

      <div class="stats-bar" id="stats-bar">
        <span>TOTAL RECORDS: 0</span>
      </div>

      <div id="records-container" class="records-grid"></div>
    </section>
  </main>

  <!-- Full Details View Modal -->
  <div class="modal-backdrop" id="view-modal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="modal-id" style="border:none; margin:0;">ID</h2>
        <button onclick="document.getElementById('view-modal').style.display='none'">X</button>
      </div>
      <div id="modal-badge-wrap" style="margin-top:0.5rem;"></div>
      <img id="modal-img" alt="Target Photo" />
      <h3 id="modal-name" style="color:#fff; margin-bottom:0.6rem;"></h3>
      <p id="modal-details" style="white-space:pre-wrap; line-height:1.5; color:#b4ffbe; font-size:0.9rem;"></p>
      <p id="modal-date" style="margin-top:1rem; font-size:0.75rem; color:var(--text-dim);"></p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'grand_leakage_db_v1';
    let currentPhotoBase64 = '';

    // 1. Matrix Hacker Rain Background
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*アイウエオカキクケコサシスセソ';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 8, 5, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 45);

    // 2. Photo Compression & Base64 Encoding (keeps storage light & fast)
    document.getElementById('person-photo').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) {
        currentPhotoBase64 = '';
        document.getElementById('photo-preview').style.display = 'none';
        return;
      }

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const tempCanvas = document.createElement('canvas');
          const maxDim = 500;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          tempCanvas.width = w;
          tempCanvas.height = h;
          tempCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentPhotoBase64 = tempCanvas.toDataURL('image/jpeg', 0.75);

          const preview = document.getElementById('photo-preview');
          preview.src = currentPhotoBase64;
          preview.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 3. Load & Save Functions (Permanent Browser Storage)
    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveRecords(records) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (err) {
        alert('Storage limit reached on this browser. Export a JSON backup and remove older photos.');
      }
    }

    // 4. Form Submission
    document.getElementById('leak-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const records = getRecords();

      const newRecord = {
        uid: Date.now().toString(),
        id: document.getElementById('person-id').value.trim(),
        name: document.getElementById('person-name').value.trim(),
        type: document.getElementById('person-type').value,
        photo: currentPhotoBase64,
        details: document.getElementById('person-details').value.trim(),
        timestamp: new Date().toLocaleString()
      };

      records.unshift(newRecord);
      saveRecords(records);

      this.reset();
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').style.display = 'none';
      renderRecords();
    });

    // 5. Render Stored Records
    function renderRecords() {
      const records = getRecords();
      const query = document.getElementById('search-input').value.toLowerCase();
      const filter = document.getElementById('filter-type').value;
      const container = document.getElementById('records-container');

      // Update Stats
      const counts = { Fake: 0, Scams: 0, Crime: 0, Others: 0 };
      records.forEach(r => { if (counts[r.type] !== undefined) counts[r.type]++; });
      document.getElementById('stats-bar').innerHTML = `
        <span>TOTAL: <strong>${records.length}</strong></span>
        <span>FAKE: <strong>${counts.Fake}</strong></span>
        <span>SCAMS: <strong>${counts.Scams}</strong></span>
        <span>CRIME: <strong>${counts.Crime}</strong></span>
        <span>OTHERS: <strong>${counts.Others}</strong></span>
      `;

      const filtered = records.filter(r => {
        const matchesType = filter === 'ALL' || r.type === filter;
        const matchesText =
          r.id.toLowerCase().includes(query) ||
          r.name.toLowerCase().includes(query) ||
          r.details.toLowerCase().includes(query);
        return matchesType && matchesText;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">[ NO MATCHING RECORDS IN LOCAL ARCHIVE ]</div>`;
        return;
      }

      const defaultAvatar =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180">
            <rect width="300" height="180" fill="#041207"/>
            <text x="50%" y="50%" fill="#008f11" font-family="monospace" font-size="16" text-anchor="middle" dominant-baseline="middle">[ NO PHOTO DATA ]</text>
          </svg>`
        );

      container.innerHTML = filtered
        .map(
          r => `
          <article class="record-card">
            <div>
              <div class="card-top">
                <span class="record-id">ID: ${escapeHtml(r.id)}</span>
                <span class="badge badge-${escapeHtml(r.type)}">${escapeHtml(r.type)}</span>
              </div>
              <img class="record-photo" src="${r.photo || defaultAvatar}" alt="${escapeHtml(r.name)}" />
              <div class="record-name">${escapeHtml(r.name)}</div>
              <div class="record-details">${escapeHtml(r.details.length > 130 ? r.details.slice(0, 130) + '...' : r.details)}</div>
            </div>
            <div class="record-meta">
              <span>${escapeHtml(r.timestamp)}</span>
              <div class="card-actions">
                <button onclick="viewRecord('${r.uid}')">View</button>
                <button class="btn-danger" onclick="deleteRecord('${r.uid}')">Del</button>
              </div>
            </div>
          </article>
        `
        )
        .join('');
    }

    function viewRecord(uid) {
      const record = getRecords().find(r => r.uid === uid);
      if (!record) return;

      document.getElementById('modal-id').textContent = 'ID: ' + record.id;
      document.getElementById('modal-badge-wrap').innerHTML = `<span class="badge badge-${escapeHtml(record.type)}">${escapeHtml(record.type)}</span>`;
      const imgEl = document.getElementById('modal-img');
      if (record.photo) {
        imgEl.src = record.photo;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }
      document.getElementById('modal-name').textContent = record.name;
      document.getElementById('modal-details').textContent = record.details;
      document.getElementById('modal-date').textContent = 'LOGGED ON: ' + record.timestamp;
      document.getElementById('view-modal').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.id === 'view-modal') {
        document.getElementById('view-modal').style.display = 'none';
      }
    }

    function deleteRecord(uid) {
      if (!confirm('Purge this record permanently from local storage?')) return;
      const updated = getRecords().filter(r => r.uid !== uid);
      saveRecords(updated);
      renderRecords();
    }

    // 6. Export / Import JSON so data can also move between PC, Laptop & Mobile
    function exportBackup() {
      const data = JSON.stringify(getRecords(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GRAND_LEAKAGE_BACKUP_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');
          const existing = getRecords();
          const merged = [...imported, ...existing];
          saveRecords(merged);
          renderRecords();
          alert(`Imported ${imported.length} records successfully.`);
        } catch {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial render on page load
    renderRecords();
  </script>
</body>
</html>
