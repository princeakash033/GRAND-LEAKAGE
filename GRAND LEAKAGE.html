<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> GRAND LEAKAGE </title>
  <style>
    :root {
      --bg: #050908;
      --panel: rgba(10, 18, 15, 0.88);
      --panel-2: rgba(16, 28, 23, 0.92);
      --border: #1d3b2f;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.14);
      --warn: #ffb703;
      --warn-dim: rgba(255, 183, 3, 0.16);
      --danger: #ff4d6d;
      --danger-dim: rgba(255, 77, 109, 0.16);
      --text: #e6f7ef;
      --muted: #86ad9c;
      --font-mono: "Courier New", Courier, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 20px 14px 48px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Matrix Code Rain Canvas */
    #matrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.28;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1160px;
      margin: 0 auto;
    }

    header {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--font-mono);
    }

    .brand h1 {
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      color: var(--accent);
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.25);
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .stats {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.7fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 880px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .card-title {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-family: var(--font-mono);
    }

    input[type="text"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    textarea {
      resize: vertical;
      min-height: 68px;
    }

    .photo-preview {
      margin-top: 8px;
      width: 84px;
      height: 84px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      object-fit: cover;
      display: none;
      background: var(--panel-2);
    }

    .photo-preview.active {
      display: block;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      transition: transform 0.1s, opacity 0.2s, border-color 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #05110b;
      flex: 1;
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .btn-danger {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(255, 77, 109, 0.35);
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .search-box {
      flex: 1 1 200px;
    }

    .filter-select {
      width: auto;
      min-width: 165px;
    }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .profile-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .profile-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--accent);
      background: var(--bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 1.1rem;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 7px;
    }

    .profile-name {
      font-weight: 700;
      font-size: 1rem;
      word-break: break-word;
    }

    .profile-id {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .badge-danger {
      background: var(--danger-dim);
      color: var(--danger);
      border-color: rgba(255, 77, 109, 0.4);
    }

    .badge-warn {
      background: var(--warn-dim);
      color: var(--warn);
      border-color: rgba(255, 183, 3, 0.4);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-word;
    }

    .meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .card-actions {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas" aria-hidden="true"></canvas>

  <div class="container">
    <header>
      <div class="brand">
        <h1> GRAND LEAKAGE </h1>
        <p> CRIMES AND SCAMS IN THE SOCIETY </p>
      </div>
      <div class="header-controls">
        <button type="button" class="btn-secondary" id="toggleMatrixBtn">MATRIX: ON</button>
        <div class="stats" id="recordCount">RECORDS: 0</div>
      </div>
    </header>

    <div class="grid">
      <!-- Left Column: Add Entry Form -->
      <section class="card">
        <h2 class="card-title">+ Add Profile</h2>
        <form id="dossierForm">
          <div class="form-group">
            <label for="fullName">NAME *</label>
            <input type="text" id="fullName" placeholder="e.g., Jordan Vance" required />
          </div>

          <div class="form-group">
            <label for="userId">ID / REFERENCE CODE *</label>
            <input type="text" id="userId" placeholder="e.g., REF-1042 or @handle" required />
          </div>

          <div class="form-group">
            <label for="personType">TYPE OF PERSON *</label>
            <select id="personType">
              <option value="Crime">Crime</option>
              <option value="Scams">Scams</option>
              <option value="Fake Person">Fake Person</option>
              <option value="Contact">Contact</option>
              <option value="Researcher">Researcher</option>
              <option value="Custom">Custom...</option>
            </select>
          </div>

          <div class="form-group" id="customTypeGroup" style="display: none;">
            <label for="customTypeInput">CUSTOM TYPE *</label>
            <input type="text" id="customTypeInput" placeholder="Enter custom person type" />
          </div>

          <div class="form-group">
            <label for="socialAccount">SOCIAL MEDIA ACCOUNTS</label>
            <input type="text" id="socialAccount" placeholder="e.g., X: @user, TG: @user, IG: @user" />
          </div>

          <div class="form-group">
            <label for="photoInput">PHOTO (JPG / PNG)</label>
            <input type="file" id="photoInput" accept="image/*" />
            <img id="photoPreview" class="photo-preview" alt="Preview" />
          </div>

          <div class="form-group">
            <label for="notes">DETAILS / NOTES (OPTIONAL)</label>
            <textarea id="notes" placeholder="Context, links, or observations..."></textarea>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn-primary">SAVE ENTRY</button>
            <button type="reset" class="btn-secondary" id="clearBtn">CLEAR</button>
          </div>
        </form>
      </section>

      <!-- Right Column: Stored Records -->
      <section class="card">
        <h2 class="card-title">Saved Records</h2>

        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search name, ID, social, type, or notes..."
          />
          <select id="typeFilter" class="filter-select" aria-label="Filter by person type">
            <option value="ALL">All Types</option>
          </select>
          <input type="file" id="importFile" accept="application/json" style="display:none" />
        </div>

        <div id="recordsContainer" class="records-grid"></div>
        
      </section>
    </div>
  </div>

  <script>
    // --- Matrix Rain Background ---
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    const toggleMatrixBtn = document.getElementById("toggleMatrixBtn");
    const glyphChars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ<>/\\*#+-=";
    const fontSize = 15;
    let columns = 0;
    let drops = [];
    let matrixEnabled = true;
    let animationId = null;

    function resizeMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array.from({ length: columns }, () => Math.random() * -40);
    }

    function drawMatrix() {
      if (!matrixEnabled) return;
      ctx.fillStyle = "rgba(5, 9, 8, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff88";
      ctx.font = `${fontSize}px "Courier New", monospace`;

      for (let i = 0; i < drops.length; i++) {
        const char = glyphChars[Math.floor(Math.random() * glyphChars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        ctx.fillText(char, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i] += 0.9;
      }

      animationId = requestAnimationFrame(drawMatrix);
    }

    toggleMatrixBtn.addEventListener("click", () => {
      matrixEnabled = !matrixEnabled;
      toggleMatrixBtn.textContent = matrixEnabled ? "MATRIX: ON" : "MATRIX: OFF";
      if (matrixEnabled) {
        drawMatrix();
      } else {
        cancelAnimationFrame(animationId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    });

    window.addEventListener("resize", resizeMatrix);
    resizeMatrix();
    drawMatrix();

    // --- Profile Archive Logic ---
    const STORAGE_KEY = "cyber_matrix_archive_v4";

    const form = document.getElementById("dossierForm");
    const fullNameEl = document.getElementById("fullName");
    const userIdEl = document.getElementById("userId");
    const personTypeEl = document.getElementById("personType");
    const customTypeGroupEl = document.getElementById("customTypeGroup");
    const customTypeInputEl = document.getElementById("customTypeInput");
    const socialEl = document.getElementById("socialAccount");
    const photoInputEl = document.getElementById("photoInput");
    const photoPreviewEl = document.getElementById("photoPreview");
    const notesEl = document.getElementById("notes");
    const recordsContainer = document.getElementById("recordsContainer");
    const recordCountEl = document.getElementById("recordCount");
    const searchInputEl = document.getElementById("searchInput");
    const typeFilterEl = document.getElementById("typeFilter");
    const exportBtn = document.getElementById("exportBtn");
    const importTrigger = document.getElementById("importTrigger");
    const importFile = document.getElementById("importFile");

    let currentPhotoData = "";

    personTypeEl.addEventListener("change", () => {
      const isCustom = personTypeEl.value === "Custom";
      customTypeGroupEl.style.display = isCustom ? "block" : "none";
      customTypeInputEl.required = isCustom;
    });

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        console.error("Failed to read storage:", err);
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function getBadgeClass(type) {
      const normalized = (type || "").toLowerCase();
      if (normalized === "crime" || normalized === "scams") return "badge badge-danger";
      if (normalized === "fake person") return "badge badge-warn";
      return "badge";
    }

    function syncTypeFilterOptions(records) {
      const previousSelection = typeFilterEl.value;
      const defaultTypes = ["Crime", "Scams", "Fake Person", "Contact", "Researcher"];
      const recordTypes = records.map((r) => r.personType).filter(Boolean);
      const uniqueTypes = [...new Set([...defaultTypes, ...recordTypes])];

      typeFilterEl.innerHTML =
        `<option value="ALL">All Types</option>` +
        uniqueTypes.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

      if ([...typeFilterEl.options].some((opt) => opt.value === previousSelection)) {
        typeFilterEl.value = previousSelection;
      }
    }

    photoInputEl.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) {
        currentPhotoData = "";
        photoPreviewEl.classList.remove("active");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        currentPhotoData = reader.result;
        photoPreviewEl.src = currentPhotoData;
        photoPreviewEl.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      currentPhotoData = "";
      photoPreviewEl.src = "";
      photoPreviewEl.classList.remove("active");
      customTypeGroupEl.style.display = "none";
      customTypeInputEl.required = false;
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const chosenType =
        personTypeEl.value === "Custom"
          ? customTypeInputEl.value.trim() || "Custom"
          : personTypeEl.value;

      const newRecord = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: fullNameEl.value.trim(),
        userId: userIdEl.value.trim(),
        personType: chosenType,
        social: socialEl.value.trim(),
        notes: notesEl.value.trim(),
        photo: currentPhotoData,
        createdAt: new Date().toLocaleString()
      };

      const records = loadRecords();
      records.unshift(newRecord);
      saveRecords(records);

      form.reset();
      currentPhotoData = "";
      photoPreviewEl.src = "";
      photoPreviewEl.classList.remove("active");
      customTypeGroupEl.style.display = "none";
      customTypeInputEl.required = false;

      renderRecords();
    });

    function deleteRecord(id) {
      const updated = loadRecords().filter((item) => item.id !== id);
      saveRecords(updated);
      renderRecords();
    }

    function renderRecords() {
      const query = searchInputEl.value.trim().toLowerCase();
      const selectedType = typeFilterEl.value;
      const allRecords = loadRecords();

      syncTypeFilterOptions(allRecords);
      recordCountEl.textContent = `RECORDS: ${allRecords.length}`;

      const filtered = allRecords.filter((rec) => {
        const matchesType = selectedType === "ALL" || rec.personType === selectedType;
        const matchesQuery =
          !query ||
          rec.name.toLowerCase().includes(query) ||
          rec.userId.toLowerCase().includes(query) ||
          (rec.personType && rec.personType.toLowerCase().includes(query)) ||
          (rec.social && rec.social.toLowerCase().includes(query)) ||
          (rec.notes && rec.notes.toLowerCase().includes(query));
        return matchesType && matchesQuery;
      });

      if (filtered.length === 0) {
        recordsContainer.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            No matching profiles found. Add an entry using the form to get started.
          </div>
        `;
        return;
      }

      recordsContainer.innerHTML = filtered
        .map((rec) => {
          const initials =
            rec.name
              .split(" ")
              .filter(Boolean)
              .slice(0, 2)
              .map((part) => part[0].toUpperCase())
              .join("") || "?";

          const avatarHtml = rec.photo
            ? `<div class="avatar"><img src="${rec.photo}" alt="${escapeHtml(rec.name)}" /></div>`
            : `<div class="avatar">${escapeHtml(initials)}</div>`;

          return `
            <article class="profile-card">
              <div class="profile-top">
                ${avatarHtml}
                <div>
                  <div class="profile-name">${escapeHtml(rec.name)}</div>
                  <div class="profile-id">${escapeHtml(rec.userId)}</div>
                </div>
              </div>
              ${rec.personType ? `<span class="${getBadgeClass(rec.personType)}">${escapeHtml(rec.personType)}</span>` : ""}
              ${rec.social ? `<div class="meta"><strong>Social:</strong> ${escapeHtml(rec.social)}</div>` : ""}
              ${rec.notes ? `<div class="meta"><strong>Notes:</strong> ${escapeHtml(rec.notes)}</div>` : ""}
              <div class="meta" style="font-size:0.75rem;">Added: ${escapeHtml(rec.createdAt)}</div>
              <div class="card-actions">
                <button type="button" class="btn-danger" onclick="deleteRecord('${rec.id}')">DELETE</button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    searchInputEl.addEventListener("input", renderRecords);
    typeFilterEl.addEventListener("change", renderRecords);

    exportBtn.addEventListener("click", () => {
      const data = localStorage.getItem(STORAGE_KEY) || "[]";
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "matrix-archive-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    importTrigger.addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error("Invalid format");
          saveRecords(parsed);
          renderRecords();
        } catch {
          alert("Invalid JSON backup file.");
        }
      };
      reader.readAsText(file);
      importFile.value = "";
    });

    renderRecords();
  </script>
</body>
</html>
